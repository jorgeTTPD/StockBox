[package]
name = "stockbox"
version = "0.1.0"
description = "Aplicación Tauri de StockBox (interfaz React sobre el núcleo compartido)"
authors = ["jorgeTTPD"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "stockbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
stockbox-core = { path = "../crates/stockbox-core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.43", features = ["bundled"] }
serde_json = "1"
thiserror = "2"
