[package]
name = "stockbox-gpui"
version = "0.1.0"
description = "Versión GPUI de StockBox: Rust puro, sin WebView"
edition = "2021"
rust-version = "1.90"

[dependencies]
stockbox-core = { path = "../stockbox-core" }
gpui = { package = "gpui-pre", version = "0.3.14" }
gpui-platform = { package = "gpui-pre-platform", version = "0.3.14", features = ["font-kit", "wayland", "x11"] }
gpui-component = "0.11.0"
serde_json = "1"
libc = "=0.2.183"
